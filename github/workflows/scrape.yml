name: Weekly Price Scrape

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r project/requirements.txt

      - name: Run scraper
        run: python project/project.py huile_1L "https://site-exemple.com/produit/huile" --selector ".price" --plot

      - name: Commit updated history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add project/price_history.csv project/*.png
          git commit -m "Auto update: weekly price scrape" || echo "Nothing to commit"
          git push
